name: character-ai-starter-kit

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatkit}
      POSTGRES_DB: ${POSTGRES_DB:-chatkit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatkit} -d ${POSTGRES_DB:-chatkit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 로컬에서 인증/재설정 메일의 실제 링크를 확인하는 개발 전용 SMTP 수신함.
  mailpit:
    image: axllent/mailpit:v1.31.1
    profiles: [auth-dev]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  redis_data:
