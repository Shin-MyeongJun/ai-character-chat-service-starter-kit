<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모서리 · 메인 디자인 검토</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#e7e4e0;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:#28262b}button,select{font:inherit}button{cursor:pointer}.toolbar{display:flex;gap:10px;align-items:center;padding:14px 24px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0001}.toolbar strong{margin-right:auto}.toolbar button,.toolbar select{border:1px solid #ddd;border-radius:8px;background:#fff;padding:9px 12px}.toolbar button.active{background:#28262b;color:#fff}.notice{font-size:12px;color:#655e69;margin:16px 24px}.canvas{padding:24px;display:flex;align-items:flex-start;gap:40px;min-width:max-content}.board-label{font-size:13px;font-weight:700;margin-bottom:12px;color:#625967}.board{box-shadow:0 12px 45px #28202015;overflow:hidden;border-radius:12px}.node{flex-shrink:0;position:relative}.frame{display:flex}.text{white-space:pre-wrap;overflow-wrap:anywhere}.icon{display:block}.image{object-fit:cover;object-position:center 35%;display:block}.interactive:focus-visible{outline:2px solid #5562c9;outline-offset:3px}.interactive{cursor:pointer}.interactive:hover{filter:brightness(.975)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;background:#28262b;color:white;z-index:10;box-shadow:0 4px 20px #0003;display:none;font-size:13px}
</style>
<div class="toolbar"><strong>✳ 모서리 <span style="font-weight:400;font-size:12px;margin-left:12px">디자인 검토 · 서비스 연결 없음</span></strong><button data-view="desktop" class="active">PC</button><button data-view="mobile">모바일</button><button data-view="components">컴포넌트</button><button data-view="states">주요 상태</button><button data-view="notes">구현 메모</button><select id="audience" aria-label="사용자 상태"><option value="adult">확인된 성인</option><option value="minor">미성년</option><option value="unknown">연령 미확인 / 로그아웃</option></select><button id="theme">다크 모드</button></div>
<div class="notice">표지·작품·대화는 시안용 예시입니다. 상단에서 화면, 테마, 사용자 상태를 바꿔 검토할 수 있습니다.</div><main id="canvas" class="canvas"></main><div class="toast" id="toast" role="status"></div>
<script src="design.js"></script><script>
const M=MOSEORI;let currentView='desktop',currentTheme='Light';
const clone=v=>JSON.parse(JSON.stringify(v));
function expand(o){if(o.type!=='instance')return o;const d=M.defs.find(d=>d.family===o.family&&d.theme===o.theme&&d.variant===o.variant);if(!d)throw Error('Missing '+o.family+o.variant);const tree=clone(d.tree);function over(n){Object.assign(n,o.overrides[n.name]||{});n.children.forEach(over);}over(tree);for(const k of ['w','h','pad'])if(o[k]!=null)tree[k]=o[k];tree.name=o.family+'/'+o.variant;tree.theme=o.theme;tree.family=o.family;tree.variant=o.variant;return tree;}
function render(raw,theme){const o=expand(raw),c=M.colors[theme],el=document.createElement(o.type==='image'?'img':o.type==='icon'?'span':'div');el.className='node '+(o.type==='shape'?'':o.type);el.dataset.name=o.name;if(o.family)el.dataset.family=o.family;
 const style={};if(o.w!=null)style.width=o.w+'px';if(o.h!=null)style.height=o.h+'px';if(o.bg)style.background=c[o.bg]||o.bg;if(o.r)style.borderRadius=o.r+'px';if(o.opacity)style.opacity=o.opacity;if(o.stroke)style.boxShadow='inset 0 0 0 '+(o.strokeWidth||1)+'px '+c[o.stroke];if(o.clip)style.overflow='hidden';
 if(o.type==='frame'){style.flexDirection=o.dir;style.gap=(o.gap||0)+'px';style.alignItems=o.align==='center'?'center':o.align==='end'?'flex-end':'flex-start';style.justifyContent=o.justify==='center'?'center':o.justify==='end'?'flex-end':'flex-start';style.padding=(Array.isArray(o.pad)?o.pad:[o.pad||0]).map(x=>x+'px').join(' ');}
 if(o.type==='text'){const [size,line,weight]=M.typography[o.style];style.fontSize=size+'px';style.lineHeight=line+'px';style.fontWeight=weight==='Bold'?'700':weight==='Medium'?'500':'400';style.color=c[o.color]||o.color;el.textContent=o.text;}
 if(o.type==='image'){el.src='assets/'+o.asset+'.png';el.alt=o.asset==='archive'?'밤의 기록 보관소 표지':o.asset==='bluehour'?'푸른 시간의 역 표지':o.asset==='garden'?'유리 온실의 계약 표지':'새벽 2시 라디오 표지';}
 if(o.type==='icon')el.innerHTML='<svg width="'+o.w+'" height="'+o.h+'" viewBox="0 0 24 24" fill="none" stroke="'+(c[o.color]||o.color)+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+M.icons[o.icon]+'</svg>';
 Object.assign(el.style,style);for(const child of o.children||[])el.appendChild(render(child,theme));
 if(['ThemeToggle','Button','Chip','Tab','MenuItem','AdultFilter','BottomItem','StoryCard'].includes(o.family)&&!o.disabled){el.tabIndex=0;el.setAttribute('role','button');el.classList.add('interactive');el.addEventListener('click',()=>{if(o.family==='ThemeToggle')toggleTheme();else if(o.family==='AdultFilter'){const on=o.variant==='Off';const replacement=render(M.ref('AdultFilter',theme,on?'On':'Off',{}, {w:o.w}),theme);el.replaceWith(replacement);toast(on?'시안: 성인 콘텐츠 포함 ON':'시안: 성인 콘텐츠 포함 OFF');}else toast('디자인 시안입니다. 실제 기능 연결은 구현 단계에서 진행합니다.');});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}});}
 return el;}
function draw(){const root=document.getElementById('canvas');root.replaceChildren();const adult=document.getElementById('audience').value==='adult';const tree=currentView==='desktop'?M.screen(currentTheme,false,adult):currentView==='mobile'?M.screen(currentTheme,true,adult):currentView==='components'?M.componentBoard(currentTheme):currentView==='states'?M.stateBoard(currentTheme):M.notesBoard();const wrap=document.createElement('section');const label=document.createElement('div');label.className='board-label';label.textContent=tree.name+' · '+(adult?'성인 확인':'미성년 / 미확인 — 성인 필터 숨김');const board=render(tree,currentTheme);board.classList.add('board');wrap.append(label,board);root.append(wrap);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));document.getElementById('theme').textContent=currentTheme==='Light'?'다크 모드':'라이트 모드';}
function toggleTheme(){currentTheme=currentTheme==='Light'?'Dark':'Light';draw();}let timer;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',2300);}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;draw();});document.getElementById('theme').onclick=toggleTheme;document.getElementById('audience').onchange=draw;draw();
</script></html>
